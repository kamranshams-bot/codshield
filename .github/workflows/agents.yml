# Runs the ingestion + maintenance agents every hour on GitHub's free runners,
# writing straight to the Neon database. Needs repo secrets DATABASE_URL and
# CODSHIELD_HASH_SECRET (Settings > Secrets and variables > Actions).
name: agents

on:
  schedule:
    - cron: "7 * * * *"   # hourly, at minute 7
  workflow_dispatch: {}   # "Run workflow" button for a manual run

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m codshield.agents run
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CODSHIELD_HASH_SECRET: ${{ secrets.CODSHIELD_HASH_SECRET }}

  test:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt && pytest -q
