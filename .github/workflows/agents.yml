# Free GitHub runners do two jobs for CODShield:
#  1. keep-alive: ping the site every 10 minutes so Render's free server doesn't fall asleep
#     (a sleeping server takes ~50 s to answer the first order check). The server itself runs the
#     daily retention purge and checks while it is awake, so no database secrets are needed here.
#  2. tests: run the test suite on every push to main.
name: keep-alive and tests

on:
  schedule:
    - cron: "*/10 * * * *"
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  keep-alive:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping the health check
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 70 https://codshield-sx1i.onrender.com/health) && echo "HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 10
          done
          echo "::warning::health check did not return 200"

  test:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest -q
        env:
          CODSHIELD_SKIP_ENV_FILES: "1"
