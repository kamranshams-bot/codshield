$kind: http-example
name: '200 OK'
order: 1000
request:
  url: '{{baseUrl}}/health'
  method: GET
response:
  statusCode: 200
  statusText: 'OK'
  headers:
    - key: Content-Type
      value: 'application/json'
  body:
    type: json
    content: |-
      {
        "ok": true,
        "db": "ok",
        "pool": {
          "size": 5,
          "checked_out": 0,
          "overflow": -3,
          "idle": 2
        }
      }
