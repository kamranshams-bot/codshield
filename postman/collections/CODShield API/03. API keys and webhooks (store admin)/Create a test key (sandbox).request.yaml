$kind: http-request
method: POST
url: '{{baseUrl}}/v1/api-keys'
order: 2000
headers:
  - key: 'Content-Type'
    value: 'application/json'
body:
  type: json
  content: |-
    {
      "name": "Postman sandbox",
      "mode": "test",
      "scopes": [
        "check",
        "report",
        "read"
      ]
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("status 201", () => pm.response.to.have.status(201));
      pm.environment.set("testApiKey", pm.response.json().api_key);
examples: './.resources/Create a test key (sandbox).resources/examples/'
