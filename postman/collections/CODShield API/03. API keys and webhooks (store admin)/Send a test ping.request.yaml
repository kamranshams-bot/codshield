$kind: http-request
method: POST
url: '{{baseUrl}}/v1/webhooks/{{webhookId}}/test'
order: 7000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("status 200", () => pm.response.to.have.status(200));
examples: './.resources/Send a test ping.resources/examples/'
# path variables come from the environment: webhookId
