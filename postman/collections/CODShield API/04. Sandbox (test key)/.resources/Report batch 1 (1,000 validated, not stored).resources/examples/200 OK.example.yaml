        "requires_approval": false,
        "results": [
          {
            "index": 0,
            "outcome": "test_accepted",
            "test_mode": true
          },
          {
            "index": 1,
            "outcome": "test_accepted",
            "test_mode": true
          },
          {
            "index": 2,
            "outcome": "test_accepted",
            "test_mode": true
          }
        ],
        "test_mode": true
      }
