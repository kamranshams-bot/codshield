$kind: http-request
method: POST
url: '{{baseUrl}}/v1/check'
order: 6000
headers:
  - key: 'Content-Type'
    value: 'application/json'
body:
  type: json
  content: |-
    {
      "phone": "+971500000003",
      "country": "AE"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("status 200", () => pm.response.to.have.status(200));
      pm.test("band is low", () => pm.expect(pm.response.json().band).to.eql("low"));
      pm.test("test_mode", () => pm.expect(pm.response.json().test_mode).to.eql(true));
examples: './.resources/Check +971500000003 → low.resources/examples/'
