$kind: http-example
name: '413 batch too large'
order: 2000
request:
  url: '{{baseUrl}}/v1/check/batch'
  method: POST
response:
  statusCode: 413
  statusText: 'Content Too Large'
  headers:
    - key: Content-Type
      value: 'application/json'
  body:
    type: json
    content: |-
      {
        "detail": "max 500 orders per batch",
        "error": {
          "code": "batch_too_large",
          "message": "max 500 orders per batch",
          "status": 413,
          "request_id": "req_9e16e1bba44be3cc"
        }
      }
