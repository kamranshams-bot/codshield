$kind: http-example
name: '401 invalid key'
order: 3000
request:
  url: '{{baseUrl}}/v1/check'
  method: POST
response:
  statusCode: 401
  statusText: 'Unauthorized'
  headers:
    - key: Content-Type
      value: 'application/json'
  body:
    type: json
    content: |-
      {
        "detail": "invalid API key",
        "error": {
          "code": "invalid_api_key",
          "message": "invalid API key",
          "status": 401,
          "request_id": "req_782ed78d94080d99"
        }
      }
