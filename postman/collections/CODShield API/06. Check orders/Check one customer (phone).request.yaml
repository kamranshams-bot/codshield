$kind: http-request
method: POST
url: '{{baseUrl}}/v1/check'
order: 1000
headers:
  - key: 'Content-Type'
    value: 'application/json'
body:
  type: json
  content: |-
    {
      "phone": "{{disputePhone}}",
      "country": "PK"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("status 200", () => pm.response.to.have.status(200));
      pm.test("has band", () => pm.expect(["low","medium","high"]).to.include(pm.response.json().band));
examples: './.resources/Check one customer (phone).resources/examples/'
