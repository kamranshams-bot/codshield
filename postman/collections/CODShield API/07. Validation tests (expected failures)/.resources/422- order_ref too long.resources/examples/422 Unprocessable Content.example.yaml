$kind: http-example
name: '422 Unprocessable Content'
order: 1000
request:
  url: '{{baseUrl}}/v1/events'
  method: POST
response:
  statusCode: 422
  statusText: 'Unprocessable Content'
  headers:
    - key: Content-Type
      value: 'application/json'
  body:
    type: json
    content: |-
      {
        "detail": [
          {
            "type": "string_too_long",
            "loc": [
              "body",
              "order_ref"
            ],
            "msg": "String should have at most 100 characters",
            "input": "XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX",
            "ctx": {
              "max_length": 100
            }
          }
        ],
        "error": {
          "code": "validation_failed",
          "message": "order_ref: String should have at most 100 characters",
          "status": 422,
          "request_id": "req_8659070a189609fc",
          "fields": [
            {
              "field": "order_ref",
              "message": "String should have at most 100 characters"
            }
          ]
        }
      }
