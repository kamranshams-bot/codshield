$kind: http-example
name: '200 OK'
order: 1000
request:
  url: '{{baseUrl}}/v1/events/batch'
  method: POST
response:
  statusCode: 200
  statusText: 'OK'
  headers:
    - key: Content-Type
      value: 'application/json'
  body:
    type: json
    content: |-
      {
        "batch_ref": "B-5739267A",
        "requires_approval": false,
        "results": [
          {
            "index": 0,
            "outcome": "rejected",
            "error": "unknown event type 'not_a_type'"
          },
          {
            "index": 1,
            "outcome": "rejected",
            "error": "unknown event type 'REFUSED'"
          },
          {
            "index": 2,
            "outcome": "rejected",
            "error": "unknown event type 'delivered'"
          }
        ]
      }
