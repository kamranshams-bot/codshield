$kind: http-request
method: POST
url: '{{baseUrl}}/v1/check'
order: 11000
headers:
  - key: 'Content-Type'
    value: 'application/json'
body:
  type: json
  content: |-
    {
      "phone": "03001234567"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("status 401", () => pm.response.to.have.status(401));
examples: './.resources/No key → 401.resources/examples/'
