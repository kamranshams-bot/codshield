$kind: http-request
method: POST
url: '{{baseUrl}}/v1/submissions/approve'
order: 6000
headers:
  - key: 'Content-Type'
    value: 'application/json'
body:
  type: json
  content: |-
    {
      "ids": [{{submissionId}}]
    }
auth:
  type: bearer
  credentials:
    - key: 'token'
      value: '{{checkerToken}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("status 200", () => pm.response.to.have.status(200));
      pm.test("approved", () => pm.expect(pm.response.json().results[0].ok).to.eql(true));
examples: './.resources/Checker approves one.resources/examples/'
