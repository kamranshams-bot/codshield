$kind: http-request
method: POST
url: '{{baseUrl}}/v1/auth/login'
order: 4000
headers:
  - key: 'Content-Type'
    value: 'application/json'
body:
  type: json
  content: |-
    {
      "email": "{{checkerEmail}}",
      "password": "{{checkerPassword}}"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("status 200", () => pm.response.to.have.status(200));
      pm.environment.set("checkerToken", pm.response.json().token);
examples: './.resources/Checker logs in.resources/examples/'
