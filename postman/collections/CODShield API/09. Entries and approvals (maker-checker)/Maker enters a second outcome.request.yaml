$kind: http-request
method: POST
url: '{{baseUrl}}/v1/events'
order: 3000
headers:
  - key: 'Content-Type'
    value: 'application/json'
body:
  type: json
  content: |-
    {
      "order_ref": "TEST-PK-{{$timestamp}}-2",
      "type": "unreachable",
      "occurred_at": "2026-10-12T15:30:00Z",
      "phone": "03001234567",
      "city": "Lahore",
      "country": "PK",
      "amount": 4500,
      "currency": "PKR",
      "evidence": "TCS CN 77812345"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("status 201", () => pm.response.to.have.status(201));
      pm.environment.set("submissionId2", pm.response.json().submission_id);
examples: './.resources/Maker enters a second outcome.resources/examples/'
