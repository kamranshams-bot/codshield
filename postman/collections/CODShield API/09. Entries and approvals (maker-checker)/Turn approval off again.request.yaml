$kind: http-request
method: PATCH
url: '{{baseUrl}}/v1/tenant'
order: 9000
headers:
  - key: 'Content-Type'
    value: 'application/json'
body:
  type: json
  content: |-
    {
      "require_approval": false
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("status 200", () => pm.response.to.have.status(200));
examples: './.resources/Turn approval off again.resources/examples/'
