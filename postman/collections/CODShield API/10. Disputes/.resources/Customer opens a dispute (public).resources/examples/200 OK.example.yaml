$kind: http-example
name: '200 OK'
order: 1000
request:
  url: '{{baseUrl}}/v1/disputes'
  method: POST
response:
  statusCode: 200
  statusText: 'OK'
  headers:
    - key: Content-Type
      value: 'application/json'
  body:
    type: json
    content: |-
      {
        "status": "received",
        "message": "Thank you. If we hold records linked to this number, we'll confirm it belongs to you and review them. We'll contact you if you left contact details."
      }
