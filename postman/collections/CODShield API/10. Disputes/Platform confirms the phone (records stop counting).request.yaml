$kind: http-request
method: POST
url: '{{baseUrl}}/v1/admin/disputes/{{disputeId}}/verify'
order: 4000
auth:
  type: apikey
  credentials:
    - key: 'key'
      value: 'X-Admin-Key'
    - key: 'value'
      value: '{{adminKey}}'
    - key: 'in'
      value: 'header'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("status 200", () => pm.response.to.have.status(200));
examples: './.resources/Platform confirms the phone (records stop counting).resources/examples/'
# path variables come from the environment: disputeId
