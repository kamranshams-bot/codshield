$kind: http-request
method: POST
url: '{{baseUrl}}/v1/disputes/{{disputeId}}/respond'
order: 3000
headers:
  - key: 'Content-Type'
    value: 'application/json'
body:
  type: json
  content: |-
    {
      "action": "confirm",
      "note": "Courier proof on file."
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("status 200", () => pm.response.to.have.status(200));
examples: './.resources/Store responds (confirm or withdraw).resources/examples/'
# path variables come from the environment: disputeId
