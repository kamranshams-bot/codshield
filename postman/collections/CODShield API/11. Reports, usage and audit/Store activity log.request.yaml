$kind: http-request
method: GET
url: '{{baseUrl}}/v1/audit?limit=100'
order: 4000
queryParams:
  - key: 'limit'
    value: '100'
auth:
  type: bearer
  credentials:
    - key: 'token'
      value: '{{sessionToken}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("status 200", () => pm.response.to.have.status(200));
examples: './.resources/Store activity log.resources/examples/'
