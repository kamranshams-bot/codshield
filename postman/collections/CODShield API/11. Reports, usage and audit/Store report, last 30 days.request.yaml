$kind: http-request
method: GET
url: '{{baseUrl}}/v1/reports?days=30'
order: 1000
queryParams:
  - key: 'days'
    value: '30'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("status 200", () => pm.response.to.have.status(200));
examples: './.resources/Store report, last 30 days.resources/examples/'
