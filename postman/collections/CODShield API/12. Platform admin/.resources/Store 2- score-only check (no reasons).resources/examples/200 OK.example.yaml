$kind: http-example
name: '200 OK'
order: 1000
request:
  url: '{{baseUrl}}/v1/check'
  method: POST
response:
  statusCode: 200
  statusText: 'OK'
  headers:
    - key: Content-Type
      value: 'application/json'
  body:
    type: json
    content: |-
      {
        "score": 92,
        "band": "high",
        "recommended_action": "require_prepayment_or_partial_advance",
        "matched_on": [
          "phone"
        ],
        "detail": "score_only_tier"
      }
