$kind: http-request
name: 'Store 2: back to contributor, plan enterprise'
method: PATCH
url: '{{baseUrl}}/v1/admin/merchants/{{merchantId2}}'
order: 7000
headers:
  - key: 'Content-Type'
    value: 'application/json'
body:
  type: json
  content: |-
    {
      "tier": "contributor",
      "plan": "enterprise"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("status 200", () => pm.response.to.have.status(200));
examples: './.resources/Store 2- back to contributor, plan enterprise.resources/examples/'
# path variables come from the environment: merchantId2
