$kind: http-request
name: 'Pause / change settings'
method: PATCH
url: '{{baseUrl}}/v1/integrations/{{integrationId}}'
order: 3000
headers:
  - key: 'Content-Type'
    value: 'application/json'
body:
  type: json
  content: |-
    {
      "active": true,
      "add_note": true
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("status 200", () => pm.response.to.have.status(200));
# path variables come from the environment: integrationId
