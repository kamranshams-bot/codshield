$kind: http-request
method: POST
url: '{{baseUrl}}/v1/auth/forgot'
order: 1000
headers:
  - key: 'Content-Type'
    value: 'application/json'
body:
  type: json
  content: |-
    {
      "email": "{{userEmail}}"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("status 200", () => pm.response.to.have.status(200));
examples: './.resources/Forgot password (emails a link).resources/examples/'
