$kind: http-request
method: POST
url: '{{baseUrl}}/v1/auth/reset'
order: 2000
headers:
  - key: 'Content-Type'
    value: 'application/json'
body:
  type: json
  content: |-
    {
      "token": "pw_paste-the-token-from-the-link",
      "new_password": "{{newPassword}}"
    }
auth:
  type: noauth
examples: './.resources/Set a password from an emailed link.resources/examples/'
